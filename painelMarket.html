<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Menu lateral -->
        <aside class="menu">

            <input type="text" placeholder="Pesquisar">

            <hr>

            <label><input type="checkbox"> Jogos</label><br>
            <label><input type="checkbox"> Consoles</label><br>
            <label><input type="checkbox"> GiftCards</label>

            <hr>

            <label><input type="checkbox"> Nintendo</label><br>
            <label><input type="checkbox"> Xbox</label><br>
            <label><input type="checkbox"> Playstation</label>

            <hr>

            <p>Preço</p>
            <input type="range">

            <p>Avaliação</p>
            ★★★☆☆

        </aside>

        <!-- Produtos -->
        <main class="produtos">

            <div class="card">
                <img src="mario.jpg">
                <p>Mario Odyssey</p>
            </div>

            <div class="card">
                <img src="minecraft.jpg">
                <p>Minecraft</p>
            </div>

            <!-- Este ocupa duas colunas -->
            <div class="card">
                <img src="n64.jpg">
                <p>Nintendo 64</p>
            </div>

            <div class="card grande">
                <img src="zelda.jpg">
                <p>Zelda</p>
            </div>

        </main>

    </div>

</body>
</html>
